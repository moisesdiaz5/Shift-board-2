<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shift board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  * { box-sizing: border-box; font-family: 'IBM Plex Sans', sans-serif; margin: 0; padding: 0; }
  body { background: #EEF0EA; color: #202A22; }
  .ss-title { font-family: 'Fraunces', serif; }
  .ss-mono { font-family: 'IBM Plex Mono', monospace; }
  .ss-input, .ss-select {
    border: 1px solid #D8DBCF; border-radius: 6px; padding: 7px 10px;
    font-size: 13px; background: #fff; color: #202A22;
  }
  .ss-input:focus, .ss-select:focus {
    outline: none; border-color: #35507A; box-shadow: 0 0 0 3px rgba(53,80,122,0.12);
  }
  .ss-btn {
    background: #35507A; color: #fff; border: none; border-radius: 6px;
    padding: 8px 14px; font-size: 13px; font-weight: 500; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .ss-btn:hover { background: #2A4064; }
  .ss-btn-ghost {
    background: transparent; color: #5F5E5A; border: 1px solid #D8DBCF;
    border-radius: 6px; padding: 7px 10px; font-size: 12px; cursor: pointer;
  }
  .ss-btn-ghost:hover { background: #F1EFE8; }
  .ss-toggle, .ss-toggle-active {
    border: none; padding: 7px 14px; font-size: 12px; font-weight: 500;
    cursor: pointer; display: flex; align-items: center;
  }
  .ss-toggle { background: #fff; color: #5F5E5A; }
  .ss-toggle:hover { background: #F1EFE8; }
  .ss-toggle-active { background: #35507A; color: #fff; }
  .task-block:hover .task-x { opacity: 1; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const PALETTE = ["#4C6B54","#52678C","#A6733F","#6E5A8C","#3F7C8A","#8C4F5A","#97833A","#6B5344"];

const DEFAULT_TASK_PRESETS = [
  "Equipment cleaning","Filler","Autoclave","Partwash","Trayloader","Vial loading","5S",
  "Washer","Atec","Manufacturing","Weeklys","Monthlys","Part install","Format parts installs",
  "Fetch from","Bubble point and reconciliation","Batch record review","Stock station and trash",
];

const START_EMPLOYEES = [
  "Chris Keel","Daniel Carrera","Kevin Moore","David Atkinson","Jarret Gaskins","Daja Gregory",
  "Marilu Benitez","Janice Stancill","Moises Diaz","Robert Jones","Eric Boyd",
].map((name, i) => ({ id: `emp-${i}`, name, color: PALETTE[i % PALETTE.length] }));

function fmtHour(h) {
  const hour = Math.floor(h);
  const min = Math.round((h - hour) * 60);
  const period = hour >= 12 ? "PM" : "AM";
  let displayHour = hour % 12;
  if (displayHour === 0) displayHour = 12;
  return min === 0 ? `${displayHour}${period}` : `${displayHour}:${String(min).padStart(2, "0")}${period}`;
}

function overlaps(a, b) {
  return a.start < b.start + b.duration && b.start < a.start + a.duration;
}

function localDateStr(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function todayStr() { return localDateStr(new Date()); }

function effectiveBoardDate() {
  const now = new Date();
  const cutoff = new Date(now);
  cutoff.setHours(18, 1, 0, 0);
  return now >= cutoff ? addDays(todayStr(), 1) : todayStr();
}

function getWeekStart(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  d.setDate(d.getDate() + diff);
  return d.toISOString().slice(0, 10);
}

function addDays(dateStr, days) {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

function formatWeekLabel(weekStartStr) {
  const start = new Date(weekStartStr + "T00:00:00");
  const end = new Date(addDays(weekStartStr, 6) + "T00:00:00");
  const opts = { month: "short", day: "numeric" };
  return `${start.toLocaleDateString(undefined, opts)} \u2013 ${end.toLocaleDateString(undefined, opts)}`;
}

const STORAGE_KEY = "shift-scheduler-state";

async function fetchRemote(url, key) {
  const res = await fetch(`${url}/rest/v1/scheduler_state?id=eq.main&select=data`, {
    headers: { apikey: key, Authorization: `Bearer ${key}` },
    cache: "no-store",
  });
  if (!res.ok) throw new Error("bad response");
  const rows = await res.json();
  return rows && rows[0] ? rows[0].data : null;
}

async function pushRemote(url, key, data) {
  const res = await fetch(`${url}/rest/v1/scheduler_state`, {
    method: "POST",
    headers: {
      apikey: key,
      Authorization: `Bearer ${key}`,
      "Content-Type": "application/json",
      Prefer: "resolution=merge-duplicates,return=minimal",
    },
    body: JSON.stringify({ id: "main", data }),
  });
  if (!res.ok) throw new Error("bad response");
}

function ShiftScheduler() {
  const [employees, setEmployees] = useState(START_EMPLOYEES);
  const [tasks, setTasks] = useState([]);
  const [range, setRange] = useState({ start: 6, end: 18 });
  const [newEmpName, setNewEmpName] = useState("");
  const [form, setForm] = useState({ employeeId: START_EMPLOYEES[0].id, name: "", start: 6, duration: 1, date: todayStr() });
  const [now, setNow] = useState(new Date());
  const [error, setError] = useState("");
  const [editingId, setEditingId] = useState(null);
  const [taskPresets, setTaskPresets] = useState(DEFAULT_TASK_PRESETS);
  const [newTaskType, setNewTaskType] = useState("");
  const [loaded, setLoaded] = useState(false);
  const [view, setView] = useState("board");
  const [historyEmployeeId, setHistoryEmployeeId] = useState(START_EMPLOYEES[0].id);
  const [weekOffset, setWeekOffset] = useState(0);
  const [boardDate, setBoardDate] = useState(effectiveBoardDate);
  const [followToday, setFollowToday] = useState(true);
  const [supabaseUrl, setSupabaseUrl] = useState(() => localStorage.getItem("scheduler-supabase-url") || "");
  const [supabaseKey, setSupabaseKey] = useState(() => localStorage.getItem("scheduler-supabase-key") || "");
  const [supabaseUrlInput, setSupabaseUrlInput] = useState(() => localStorage.getItem("scheduler-supabase-url") || "");
  const [supabaseKeyInput, setSupabaseKeyInput] = useState(() => localStorage.getItem("scheduler-supabase-key") || "");
  const [showSettings, setShowSettings] = useState(false);
  const [syncStatus, setSyncStatus] = useState("none");

  function applyState(saved) {
    if (!saved) return;
    if (saved.employees) setEmployees(saved.employees);
    if (saved.tasks) setTasks(saved.tasks);
    if (saved.taskPresets) {
      const merged = [...DEFAULT_TASK_PRESETS];
      saved.taskPresets.forEach((p) => { if (!merged.includes(p)) merged.push(p); });
      setTaskPresets(merged);
    }
    if (saved.range) setRange(saved.range);
  }

  useEffect(() => {
    async function init() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) applyState(JSON.parse(raw));
      } catch (e) {}
      if (supabaseUrl && supabaseKey) {
        try {
          setSyncStatus("loading");
          const remote = await fetchRemote(supabaseUrl, supabaseKey);
          if (remote) applyState(remote);
          setSyncStatus("synced");
        } catch (e) {
          setSyncStatus("error");
        }
      }
      setLoaded(true);
    }
    init();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    const state = { employees, tasks, taskPresets, range };
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    if (supabaseUrl && supabaseKey) {
      pushRemote(supabaseUrl, supabaseKey, state).then(() => setSyncStatus("synced")).catch(() => setSyncStatus("error"));
    }
  }, [employees, tasks, taskPresets, range, loaded]);

  async function syncNow() {
    if (!supabaseUrl || !supabaseKey) return;
    try {
      setSyncStatus("loading");
      const remote = await fetchRemote(supabaseUrl, supabaseKey);
      if (remote) applyState(remote);
      setSyncStatus("synced");
    } catch (e) {
      setSyncStatus("error");
    }
  }

  function saveSupabaseConfig() {
    const url = supabaseUrlInput.trim().replace(/\/$/, "");
    const key = supabaseKeyInput.trim();
    localStorage.setItem("scheduler-supabase-url", url);
    localStorage.setItem("scheduler-supabase-key", key);
    setSupabaseUrl(url);
    setSupabaseKey(key);
    if (url && key) syncNow();
    else setSyncStatus("none");
  }

  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 60000);
    return () => clearInterval(t);
  }, []);

  useEffect(() => {
    if (!followToday) return;
    const eff = effectiveBoardDate();
    setBoardDate((prev) => (prev === eff ? prev : eff));
  }, [now, followToday]);

  useEffect(() => {
    if (editingId) return;
    setForm((f) => (f.date === boardDate ? f : { ...f, date: boardDate }));
  }, [boardDate, editingId]);

  function goToBoardDate(dateStr) {
    setBoardDate(dateStr);
    setFollowToday(dateStr === effectiveBoardDate());
  }
  function prevBoardDay() { goToBoardDate(addDays(boardDate, -1)); }
  function nextBoardDay() { goToBoardDate(addDays(boardDate, 1)); }
  function jumpToToday() { setFollowToday(true); setBoardDate(effectiveBoardDate()); }

  const totalHours = range.end - range.start;
  const hourMarks = [];
  for (let h = range.start; h <= range.end; h++) hourMarks.push(h);

  const nowDecimal = now.getHours() + now.getMinutes() / 60;
  const showNowLine = boardDate === todayStr() && nowDecimal >= range.start && nowDecimal <= range.end;
  const nowPct = ((nowDecimal - range.start) / totalHours) * 100;

  const conflictIds = useMemo(() => {
    const conflicts = new Set();
    employees.forEach((emp) => {
      const empTasks = tasks.filter((t) => t.employeeId === emp.id && t.date === boardDate);
      for (let i = 0; i < empTasks.length; i++) {
        for (let j = i + 1; j < empTasks.length; j++) {
          if (overlaps(empTasks[i], empTasks[j])) { conflicts.add(empTasks[i].id); conflicts.add(empTasks[j].id); }
        }
      }
    });
    return conflicts;
  }, [tasks, employees, boardDate]);

  const currentWeekStart = getWeekStart(todayStr());
  const viewedWeekStart = addDays(currentWeekStart, weekOffset * 7);

  const historyData = useMemo(() => {
    const weekEnd = addDays(viewedWeekStart, 6);
    const relevant = tasks.filter((t) => t.employeeId === historyEmployeeId && t.date >= viewedWeekStart && t.date <= weekEnd);
    const counts = {};
    relevant.forEach((t) => { counts[t.name] = (counts[t.name] || 0) + 1; });
    return Object.entries(counts).map(([name, count]) => ({ name, count })).sort((a, b) => b.count - a.count);
  }, [tasks, historyEmployeeId, viewedWeekStart]);

  const historyEmployee = employees.find((e) => e.id === historyEmployeeId);
  const maxCount = Math.max(1, ...historyData.map((d) => d.count));

  function addEmployee() {
    const name = newEmpName.trim();
    if (!name) return;
    const id = `emp-${Date.now()}`;
    setEmployees((prev) => [...prev, { id, name, color: PALETTE[prev.length % PALETTE.length] }]);
    setNewEmpName("");
  }
  function removeEmployee(id) {
    setEmployees((prev) => prev.filter((e) => e.id !== id));
    setTasks((prev) => prev.filter((t) => t.employeeId !== id));
  }
  function addTask() {
    setError("");
    if (!form.name.trim()) { setError("Give the task a name."); return; }
    if (!form.employeeId) { setError("Choose who this task is for."); return; }
    const start = Number(form.start);
    const duration = Number(form.duration);
    if (!(duration > 0)) { setError("Duration needs to be greater than 0."); return; }
    if (start < range.start || start + duration > range.end) {
      setError(`Task must fit within ${fmtHour(range.start)}\u2013${fmtHour(range.end)}.`);
      return;
    }
    if (editingId) {
      setTasks((prev) => prev.map((t) => t.id === editingId
        ? { ...t, employeeId: form.employeeId, name: form.name.trim(), start, duration, date: form.date || t.date }
        : t));
      setEditingId(null);
    } else {
      setTasks((prev) => [...prev, { id: `t-${Date.now()}`, employeeId: form.employeeId, name: form.name.trim(), start, duration, date: form.date || todayStr() }]);
    }
    setForm((f) => ({ ...f, name: "" }));
  }
  function startEdit(task) {
    setError("");
    setEditingId(task.id);
    setForm({ employeeId: task.employeeId, name: task.name, start: task.start, duration: task.duration, date: task.date || todayStr() });
  }
  function cancelEdit() { setEditingId(null); setError(""); setForm((f) => ({ ...f, name: "" })); }
  function addTaskType() {
    const name = newTaskType.trim();
    if (!name) return;
    setTaskPresets((prev) => (prev.includes(name) ? prev : [...prev, name]));
    setForm((f) => ({ ...f, name }));
    setNewTaskType("");
  }
  function removeTask(id) { setTasks((prev) => prev.filter((t) => t.id !== id)); }

  const colWidthPct = 100 / totalHours;

  if (!loaded) {
    return <div style={{ ...S.page, display: "flex", alignItems: "center", justifyContent: "center", minHeight: 200 }}>
      <p style={{ fontSize: 13, color: "#5F5E5A" }}>Loading your schedule\u2026</p>
    </div>;
  }

  return (
    <div style={S.page}>
      <div style={S.header}>
        <div>
          <h1 className="ss-title" style={S.h1}>Shift board</h1>
          <p style={S.sub}>Assign tasks by the hour. The board clears to a new day at 6:01 PM {"\u2014"} past days stay saved.</p>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 16, flexWrap: "wrap" }}>
          <div style={S.viewToggle}>
            <button type="button" className={view === "board" ? "ss-toggle-active" : "ss-toggle"} onClick={() => setView("board")}>Board</button>
            <button type="button" className={view === "history" ? "ss-toggle-active" : "ss-toggle"} onClick={() => setView("history")}>History</button>
          </div>
          <button type="button" className="ss-btn-ghost" onClick={() => setShowSettings((s) => !s)}>
            {supabaseUrl && supabaseKey ? (syncStatus === "error" ? "Sync error" : syncStatus === "loading" ? "Syncing\u2026" : "Synced") : "Set up sync"}
          </button>
          {view === "board" && (
            <div style={{ display: "flex", alignItems: "center", gap: 14, flexWrap: "wrap" }}>
              <div style={S.weekNav}>
                <button type="button" className="ss-btn-ghost" onClick={prevBoardDay} aria-label="Previous day">{"\u2039"}</button>
                <input className="ss-input ss-mono" type="date" value={boardDate} onChange={(e) => goToBoardDate(e.target.value)} style={{ width: 150 }} />
                <button type="button" className="ss-btn-ghost" onClick={nextBoardDay} aria-label="Next day">{"\u203a"}</button>
                {!followToday && <button type="button" className="ss-btn-ghost" onClick={jumpToToday}>Today</button>}
              </div>
              <div style={S.rangeControls}>
                <label style={S.rangeLabel}>Day runs
                  <input className="ss-input ss-mono" type="number" step="1" value={range.start} style={{ width: 56, marginLeft: 8 }}
                    onChange={(e) => setRange((r) => ({ ...r, start: Number(e.target.value) }))} />
                </label>
                <span style={{ color: "#888780" }}>to</span>
                <input className="ss-input ss-mono" type="number" step="1" value={range.end} style={{ width: 56 }}
                  onChange={(e) => setRange((r) => ({ ...r, end: Number(e.target.value) }))} />
                <span style={S.rangeLabel}>(24h clock)</span>
              </div>
            </div>
          )}
        </div>
      </div>

      {showSettings && (
        <div style={S.settingsPanel}>
          <div style={S.sectionLabel}>Cross-device sync (Supabase)</div>
          <p style={{ fontSize: 12, color: "#5F5E5A", marginBottom: 10 }}>
            Paste your Supabase project URL and anon public key below. Once set, this device will pull the latest
            schedule on open and push every change. Enter the same two values on any other device to share the same data.
          </p>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            <input className="ss-input" placeholder="Project URL, e.g. https://xxxx.supabase.co"
              value={supabaseUrlInput} onChange={(e) => setSupabaseUrlInput(e.target.value)} />
            <input className="ss-input" placeholder="anon public API key"
              value={supabaseKeyInput} onChange={(e) => setSupabaseKeyInput(e.target.value)} />
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              <button type="button" className="ss-btn" onClick={saveSupabaseConfig}>Save & sync</button>
              {supabaseUrl && supabaseKey && <button type="button" className="ss-btn-ghost" onClick={syncNow}>Sync now</button>}
            </div>
          </div>
          <div style={{ fontSize: 12, marginTop: 8, color: syncStatus === "error" ? "#993C1D" : "#5F5E5A" }}>
            Status: {supabaseUrl && supabaseKey ? (syncStatus === "error" ? "couldn't reach Supabase \u2014 check the URL/key and that the table exists" : syncStatus === "loading" ? "syncing\u2026" : "connected") : "not connected \u2014 saving to this browser only"}
          </div>
        </div>
      )}

      {view === "board" && (
      <div style={S.body}>
        <div style={S.sidebar}>
          <div style={S.sidebarSection}>
            <div style={S.sectionLabel}>Team</div>
            {employees.map((emp) => {
              const hrs = tasks.filter((t) => t.employeeId === emp.id && t.date === boardDate).reduce((s, t) => s + t.duration, 0);
              return (
                <div key={emp.id} style={S.empRow}>
                  <span style={{ ...S.dot, background: emp.color }} />
                  <span style={{ flex: 1, fontSize: 13 }}>{emp.name}</span>
                  <span style={{ fontSize: 11, color: "#888780" }} className="ss-mono">{hrs}h</span>
                  <button style={S.iconBtn} onClick={() => removeEmployee(emp.id)} aria-label={`Remove ${emp.name}`}>{"\u00d7"}</button>
                </div>
              );
            })}
            <div style={S.addEmpRow}>
              <input className="ss-input" placeholder="New employee name" value={newEmpName} onChange={(e) => setNewEmpName(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && addEmployee()} style={{ flex: 1 }} />
              <button className="ss-btn-ghost" onClick={addEmployee}>Add</button>
            </div>
          </div>

          <div style={S.sidebarSection}>
            <div style={S.sectionLabel}>{editingId ? "Edit task" : "Assign a task"}</div>
            <div style={S.formGrid}>
              <label style={S.fieldLabel}>Employee</label>
              <select className="ss-select" value={form.employeeId} onChange={(e) => setForm((f) => ({ ...f, employeeId: e.target.value }))}>
                {employees.map((e) => <option key={e.id} value={e.id}>{e.name}</option>)}
              </select>

              <label style={S.fieldLabel}>Task</label>
              <input className="ss-input" placeholder="e.g. Autoclave" list="task-presets" value={form.name}
                onChange={(e) => setForm((f) => ({ ...f, name: e.target.value }))} onKeyDown={(e) => e.key === "Enter" && addTask()} />
              <datalist id="task-presets">{taskPresets.map((t) => <option key={t} value={t} />)}</datalist>
              <div style={{ display: "flex", gap: 6, marginTop: 6 }}>
                <input className="ss-input" placeholder="New task type (e.g. Capping)" value={newTaskType} onChange={(e) => setNewTaskType(e.target.value)}
                  onKeyDown={(e) => e.key === "Enter" && addTaskType()} style={{ flex: 1, fontSize: 12 }} />
                <button type="button" className="ss-btn-ghost" onClick={addTaskType}>Add type</button>
              </div>

              <label style={S.fieldLabel}>Date</label>
              <input className="ss-input ss-mono" type="date" value={form.date} onChange={(e) => setForm((f) => ({ ...f, date: e.target.value }))} />

              <label style={S.fieldLabel}>Start time</label>
              <input className="ss-input ss-mono" type="number" step="0.5" min={range.start} max={range.end} value={form.start}
                onChange={(e) => setForm((f) => ({ ...f, start: e.target.value }))} />

              <label style={S.fieldLabel}>Duration (hrs)</label>
              <input className="ss-input ss-mono" type="number" step="0.5" min="0.5" value={form.duration}
                onChange={(e) => setForm((f) => ({ ...f, duration: e.target.value }))} />
            </div>
            {error && <div style={S.errorText}>{"\u26a0"} {error}</div>}
            <button type="button" onClick={addTask} className="ss-btn" style={{ marginTop: 10, width: "100%", justifyContent: "center" }}>
              + {editingId ? "Save changes" : "Add to schedule"}
            </button>
            {editingId && <button type="button" onClick={cancelEdit} className="ss-btn-ghost" style={{ marginTop: 8, width: "100%", textAlign: "center" }}>Cancel edit</button>}
          </div>
        </div>

        <div style={S.gridWrap}>
          <div style={{ minWidth: totalHours * 64 }}>
            <div style={S.hourHeader}>
              {hourMarks.slice(0, -1).map((h, i) => (
                <div key={h} className="ss-mono" style={{ position: "absolute", left: `${(i / totalHours) * 100}%`, width: `${colWidthPct}%`, textAlign: "center", fontSize: 11, fontWeight: 600, color: "#5F5E5A" }}>
                  {fmtHour(h)}
                </div>
              ))}
              <div className="ss-mono" style={{ position: "absolute", right: 0, fontSize: 11, fontWeight: 600, color: "#5F5E5A", transform: "translateX(50%)" }}>
                {fmtHour(range.end)}
              </div>
            </div>

            {employees.map((emp) => {
              const empTasks = tasks.filter((t) => t.employeeId === emp.id && t.date === boardDate);
              return (
                <div key={emp.id} style={S.row}>
                  <div style={S.rowLabel}><span style={{ ...S.dot, background: emp.color }} />{emp.name}</div>
                  <div style={S.rowTrack}>
                    <div style={{ ...S.gridLines, gridTemplateColumns: `repeat(${totalHours}, 1fr)` }}>
                      {hourMarks.slice(0, -1).map((h, i) => (
                        <div key={h} style={{ ...S.gridCell, background: i % 2 === 0 ? "rgba(136,135,128,0.05)" : "transparent" }} />
                      ))}
                    </div>
                    {showNowLine && <div style={{ ...S.nowLine, left: `${nowPct}%` }} />}
                    {empTasks.map((t) => {
                      const left = ((t.start - range.start) / totalHours) * 100;
                      const width = (t.duration / totalHours) * 100;
                      const conflict = conflictIds.has(t.id);
                      return (
                        <div key={t.id} className="task-block" onClick={() => startEdit(t)}
                          style={{ ...S.taskBlock, left: `${left}%`, width: `calc(${width}% - 4px)`, background: emp.color,
                            outline: conflict ? "2px solid #E24B4A" : editingId === t.id ? "2px solid #202A22" : "none",
                            outlineOffset: "1px", cursor: "pointer" }}
                          title={`${t.name} \u00b7 ${fmtHour(t.start)}\u2013${fmtHour(t.start + t.duration)} (click to edit)`}>
                          <span style={S.taskText}>
                            <span style={{ display: "flex", alignItems: "center", overflow: "hidden" }}>
                              {conflict && <span style={{ marginRight: 4 }}>{"\u26a0"}</span>}
                              <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{t.name}</span>
                            </span>
                            <span style={S.taskTime}>{fmtHour(t.start)}\u2013{fmtHour(t.start + t.duration)}</span>
                          </span>
                          <button className="task-x" style={S.taskX} onClick={(e) => { e.stopPropagation(); removeTask(t.id); if (editingId === t.id) cancelEdit(); }} aria-label={`Remove ${t.name}`}>{"\u00d7"}</button>
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
      )}

      {view === "history" && (
        <div style={S.historyPanel}>
          <div style={S.historyControls}>
            <div style={S.fieldLabel}>Employee</div>
            <select className="ss-select" value={historyEmployeeId} onChange={(e) => setHistoryEmployeeId(e.target.value)} style={{ minWidth: 180 }}>
              {employees.map((e) => <option key={e.id} value={e.id}>{e.name}</option>)}
            </select>
            <div style={S.weekNav}>
              <button type="button" className="ss-btn-ghost" onClick={() => setWeekOffset((w) => w - 1)} aria-label="Previous week">{"\u2039"}</button>
              <span className="ss-mono" style={{ fontSize: 13, minWidth: 150, textAlign: "center" }}>
                {formatWeekLabel(viewedWeekStart)}{weekOffset === 0 && <span style={{ color: "#888780" }}> (this week)</span>}
              </span>
              <button type="button" className="ss-btn-ghost" onClick={() => setWeekOffset((w) => w + 1)} aria-label="Next week">{"\u203a"}</button>
              {weekOffset !== 0 && <button type="button" className="ss-btn-ghost" onClick={() => setWeekOffset(0)}>Today</button>}
            </div>
          </div>

          {historyData.length === 0 ? (
            <p style={{ fontSize: 13, color: "#888780", padding: "24px 0" }}>
              No tasks logged for {historyEmployee ? historyEmployee.name : "this employee"} during {formatWeekLabel(viewedWeekStart)}.
            </p>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 10, padding: "8px 0" }}>
              {historyData.map((d) => (
                <div key={d.name} style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <div style={{ width: 160, fontSize: 12, color: "#202A22", flexShrink: 0, textAlign: "right" }}>{d.name}</div>
                  <div style={{ flex: 1, background: "#F1EFE8", borderRadius: 4, height: 20, position: "relative" }}>
                    <div style={{ width: `${(d.count / maxCount) * 100}%`, background: historyEmployee ? historyEmployee.color : "#35507A", height: "100%", borderRadius: 4, minWidth: 4 }} />
                  </div>
                  <div className="ss-mono" style={{ width: 60, fontSize: 12, color: "#5F5E5A" }}>{d.count} time{d.count === 1 ? "" : "s"}</div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

const S = {
  page: { background: "#EEF0EA", minHeight: "100vh", padding: "28px 32px", color: "#202A22" },
  header: { display: "flex", justifyContent: "space-between", alignItems: "flex-end", flexWrap: "wrap", gap: 16, marginBottom: 24 },
  h1: { fontSize: 30, fontWeight: 600, margin: 0 },
  sub: { fontSize: 13, color: "#5F5E5A", margin: "4px 0 0" },
  rangeControls: { display: "flex", alignItems: "center", gap: 8, fontSize: 12, color: "#5F5E5A" },
  rangeLabel: { display: "flex", alignItems: "center", fontSize: 12, color: "#5F5E5A" },
  viewToggle: { display: "flex", border: "1px solid #D8DBCF", borderRadius: 8, overflow: "hidden" },
  historyPanel: { background: "#fff", border: "1px solid #D8DBCF", borderRadius: 10, padding: "18px 20px 20px" },
  settingsPanel: { background: "#fff", border: "1px solid #D8DBCF", borderRadius: 10, padding: 16, marginBottom: 20 },
  historyControls: { display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 14, marginBottom: 16 },
  weekNav: { display: "flex", alignItems: "center", gap: 6 },
  body: { display: "flex", gap: 20, alignItems: "flex-start", flexWrap: "wrap" },
  sidebar: { width: 280, flexShrink: 0, display: "flex", flexDirection: "column", gap: 16 },
  sidebarSection: { background: "#fff", border: "1px solid #D8DBCF", borderRadius: 10, padding: 16 },
  sectionLabel: { fontSize: 12, fontWeight: 600, color: "#5F5E5A", marginBottom: 12, display: "flex", alignItems: "center" },
  empRow: { display: "flex", alignItems: "center", gap: 8, padding: "6px 0" },
  dot: { width: 9, height: 9, borderRadius: "50%", flexShrink: 0 },
  iconBtn: { background: "none", border: "none", color: "#B4B2A9", cursor: "pointer", padding: 2, display: "flex", fontSize: 14 },
  addEmpRow: { display: "flex", gap: 6, marginTop: 10 },
  formGrid: { display: "grid", gridTemplateColumns: "1fr", gap: 4 },
  fieldLabel: { fontSize: 11, color: "#888780", marginTop: 8, marginBottom: 2 },
  errorText: { display: "flex", alignItems: "center", fontSize: 12, color: "#993C1D", marginTop: 10, gap: 5 },
  gridWrap: { flex: 1, minWidth: 320, background: "#fff", border: "1px solid #D8DBCF", borderRadius: 10, padding: "16px 20px 20px", overflowX: "auto" },
  hourHeader: { position: "relative", height: 20, marginBottom: 6, marginLeft: 132 },
  row: { display: "flex", alignItems: "stretch", minHeight: 62 },
  rowLabel: { width: 132, flexShrink: 0, display: "flex", alignItems: "center", gap: 8, fontSize: 13, fontWeight: 500, paddingRight: 12, borderBottom: "1px solid #EDECE5" },
  rowTrack: { position: "relative", flex: 1, borderBottom: "1px solid #EDECE5" },
  gridLines: { position: "absolute", inset: 0, display: "grid" },
  gridCell: { borderRight: "1px solid #D8DBCF" },
  nowLine: { position: "absolute", top: 0, bottom: 0, width: 2, background: "#C9622A", zIndex: 2 },
  taskBlock: { position: "absolute", top: 6, bottom: 6, borderRadius: 6, padding: "4px 8px", display: "flex", alignItems: "center", justifyContent: "space-between", color: "#fff", fontSize: 12, fontWeight: 500, overflow: "hidden", cursor: "default", zIndex: 1 },
  taskText: { display: "flex", flexDirection: "column", justifyContent: "center", overflow: "hidden", minWidth: 0 },
  taskTime: { fontSize: 10, fontWeight: 400, opacity: 0.85, whiteSpace: "nowrap", marginTop: 1 },
  taskX: { background: "rgba(255,255,255,0.25)", border: "none", borderRadius: 4, color: "#fff", cursor: "pointer", display: "flex", padding: 2, opacity: 0, transition: "opacity 0.15s", flexShrink: 0, marginLeft: 4 },
};

ReactDOM.createRoot(document.getElementById("root")).render(<ShiftScheduler />);
</script>
</body>
</html>
